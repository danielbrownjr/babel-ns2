name: Android Release Builds

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Babel release guard regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false

      - name: Run release guard tests
        run: |
          python3 -m unittest discover -s .ci/android/tests -p 'test_*.py' -v
          sh -n .ci/android/build.sh
          bash -n .ci/android/build.sh
          python3 -m py_compile .ci/android/verify-apk.py .ci/android/tests/test_release_guards.py

  build:
    name: Build ${{ matrix.flavor }} APK
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        flavor: [mainline, babel]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android build dependencies
        run: |
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'cmake;3.31.5' \
            'ndk;28.2.13676358'
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          command -v glslangValidator
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"
          test -x "$ANDROID_HOME/cmake/3.31.5/bin/cmake"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build Mainline Release
        if: matrix.flavor == 'mainline'
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew assembleMainlineRelease \
            --no-daemon \
            --console=plain \
            --stacktrace

      - name: Build and verify unsigned Babel Release
        if: matrix.flavor == 'babel'
        run: |
          unset BABEL_KEYSTORE_FILE BABEL_KEYSTORE_PASS BABEL_KEY_ALIAS BABEL_KEY_PASS
          unset ANDROID_KEYSTORE_FILE ANDROID_KEYSTORE_PASS ANDROID_KEY_ALIAS
          .ci/android/build.sh -t babel -b Release

      - name: Upload Mainline APK artifacts
        if: matrix.flavor == 'mainline'
        uses: actions/upload-artifact@v6
        with:
          name: eden-mainline-release-${{ github.sha }}
          path: src/android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified unsigned Babel APK
        if: matrix.flavor == 'babel'
        uses: actions/upload-artifact@v6
        with:
          name: babel-release-unsigned-${{ github.sha }}
          path: src/android/app/build/outputs/apk/babel/release/app-babel-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
