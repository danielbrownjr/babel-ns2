name: Bug Report
description: Report a reproducible Babel NS2 defect
body:
  - type: markdown
    attributes:
      value: Report Babel-specific bugs. Do not upload firmware, cryptographic keys, game dumps, credentials, or private user data. Historical Eden NS2 behavior is not evidence of Babel Android compatibility.
  - type: checkboxes
    attributes:
      label: Existing issue
      options:
        - label: I have searched existing Babel NS2 issues
          required: true
  - type: input
    id: build
    attributes:
      label: Babel build / commit
      description: Exact commit, Android flavor, and build type; say if no APK exists.
      placeholder: SHA / variant / artifact
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe observed behavior and expected behavior, including whether this was actually tested on hardware.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs and evidence
      description: Provide relevant logs with keys, personal data, and copyrighted game content removed.
  - type: textarea
    id: system
    attributes:
      label: Environment
      value: |
        Device:
        SoC/GPU:
        GPU driver:
        Android version:
        Build variant:
    validations:
      required: true
