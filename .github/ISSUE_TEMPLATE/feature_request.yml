name: Feature Request
description: Suggest a feature for Babel NS2
labels: "request"
body:
  - type: markdown
    attributes:
      value: Describe a Babel-specific feature. For upstream Eden requests, use the relevant upstream project's own channels.
  - type: checkboxes
    attributes:
      label: Existing request
      options:
        - label: I have searched existing Babel NS2 issues
          required: true
  - type: textarea
    id: what-feature
    attributes:
      label: Proposed feature
      description: What should Babel NS2 do?
    validations:
      required: true
  - type: textarea
    id: why-feature
    attributes:
      label: Use case
      description: Why would this be useful, particularly for Babel's Android distribution?
    validations:
      required: true
